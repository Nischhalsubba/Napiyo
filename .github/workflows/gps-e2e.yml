name: Browser E2E

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/components/GpsMap.tsx'
      - 'app/components/GpsMeasureScreen.tsx'
      - 'app/components/ConvertScreen.tsx'
      - 'app/utils/geospatial.ts'
      - 'app/utils/speech.ts'
      - 'app/e2e/**'
      - 'app/playwright.config.ts'
      - 'app/package.json'
      - '.github/workflows/gps-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-flows:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version-file: app/.node-version
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser E2E
        run: npm run test:e2e
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-artifacts
          path: |
            app/playwright-report/
            app/test-results/
          retention-days: 7
