name: Browser E2E

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/components/GpsMap.tsx'
      - 'app/components/GpsMeasureScreen.tsx'
      - 'app/components/ConvertScreen.tsx'
      - 'app/utils/geospatial.ts'
      - 'app/utils/speech.ts'
      - 'app/e2e/**'
      - 'app/playwright.config.ts'
      - 'app/package.json'
      - 'app/.node-version'
      - '.github/workflows/gps-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-flows:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: app/.node-version
      - name: Use pinned npm
        run: npm install --global npm@10.9.2
      - name: Install dependencies
        run: npm install --no-fund
      - name: Audit dependencies
        run: npm audit --audit-level=low
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Run browser E2E
        run: npm run test:e2e
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-e2e-artifacts
          path: |
            app/playwright-report/
            app/test-results/
          retention-days: 7
