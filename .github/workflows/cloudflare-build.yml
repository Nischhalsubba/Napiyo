name: Cloudflare build gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cloudflare-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-cloudflare-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: app/.node-version
      - name: Use pinned npm
        run: npm install --global npm@10.9.2
      - name: Install dependencies
        run: npm install --no-fund
      - name: Audit dependencies
        run: npm audit --audit-level=low
      - name: Typecheck, test, and build Cloudflare output
        run: npm run build:cloudflare
      - name: Verify Cloudflare Workers assets
        run: |
          test -f dist/index.html
          test -f dist/_headers
          test -f dist/manifest.webmanifest
          test -f dist/sw.js
          test -f wrangler.jsonc
          test ! -e dist/_redirects
          test -z "$(find dist/assets -name '*.map' -print -quit)"
          grep -q "Content-Security-Policy" dist/_headers
          grep -q "Strict-Transport-Security" dist/_headers
